[project]
name = "precis"
version = "0.1.0"
description = "An agentic pipeline that reads and summarizes thousands of research papers in parallel with LLMs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matías Blanco" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8,<3",
    "beautifulsoup4>=4.12",
    "httpx2>=2.0",
    "jinja2>=3.1",
    "lxml>=5.0",
    "markdown-it-py>=3.0",
    "numpy>=2.0",
    "pydantic>=2.10",
    "pypdf>=5.0",
    "rich>=13.0",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.5",
    "typer>=0.15",
]

[project.scripts]
precis = "precis.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "lxml-stubs>=0.5.1",
    "matplotlib>=3.9",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/precis"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "C4", "PIE", "RET"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rouge_score.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -m 'not network and not live'"
markers = [
    "network: needs internet access (arXiv); run with -m network",
    "live: calls the real Anthropic API and costs money; run with -m live",
]
